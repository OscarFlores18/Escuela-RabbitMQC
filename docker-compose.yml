services:

  registry:
    build:
      context: ./registry
      dockerfile: Dockerfile
    container_name: registry
    ports:
      - "8761:8761"
    networks:
      - escuela-network

  configserver:
    build:
      context: ./configServer
      dockerfile: Dockerfile
    container_name: configserver
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - escuela-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - escuela-network

  auth:
    build:
      context: ./Auth
      dockerfile: Dockerfile
    container_name: auth
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      registry:
        condition: service_started
    networks:
      - escuela-network

  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
      auth:
        condition: service_started
    networks:
      - escuela-network

  colegio-angular:
    build:
      context: ./colegio-angular
      dockerfile: Dockerfile
    container_name: colegio-angular
    ports:
      - "4200:4000"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - escuela-network


  alumno:
    build:
      context: ./Alumno
      dockerfile: Dockerfile
    container_name: alumno
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - escuela-network

  cursos:
    build:
      context: ./Cursos
      dockerfile: Dockerfile
    container_name: cursos
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - escuela-network

  administracion:
    build:
      context: ./Administracion
      dockerfile: Dockerfile
    container_name: administracion
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
    networks:
      - escuela-network

  adminserver:
    build:
      context: ./AdminServer
      dockerfile: Dockerfile
    container_name: adminserver
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
    networks:
      - escuela-network

networks:
  escuela-network:
    driver: bridge