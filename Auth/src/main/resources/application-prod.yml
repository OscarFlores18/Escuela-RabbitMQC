spring:
  application:
    name: AUTH

  datasource:
    url: jdbc:mysql://mysql:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600
