spring:
  application:
    name: configserver
  cloud:
    config:
      server:
        git:
          uri: https://github.com/OscarFlores18/PropertiesEscuela
          clone-on-start: true
          default-label: main
        overrides:
          gateway.internal-secret: ${GATEWAY_INTERNAL_SECRET}
server:
  port: 8888
---
spring:
  config:
    activate:
      on-profile: dev
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/